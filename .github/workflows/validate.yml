name: Static validation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check browser JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check standalone JavaScript files
        run: |
          node --check cloud-sync.js
          node --check geo-selfie.js
          node --check sp-warning.js
          node --check notifications.js
          node --check staff-evaluation.js
          node --check priority-suite.js
          node --check < apps-script/Code.gs

      - name: Check inline JavaScript in index.html
        run: node scripts/check-inline-js.mjs
